[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Measured RAG: hybrid search, reranking, cited answers and an agent mode over the Kubernetes docs, every default backed by evals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phuong Le" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.3",
    "pydantic-settings>=2.16.2",
    "typer>=0.12",
    "pyyaml>=6.0.3",
    "openai>=3.41.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "anthropic>=2.3.0",
    "json-repair>=0.64.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pypdf>=6.21.4,<7",
]

[project.urls]
Repository = "https://github.com/phuong-le-tech/rag-pipeline"

[project.scripts]
rag = "rag.cli:app"

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs the docker compose Postgres (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Explicit, so classification never depends on whether a module file exists yet.
known-first-party = ["rag"]
