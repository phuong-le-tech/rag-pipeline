[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-style RAG pipeline: hybrid search, reranking, cited answers, measured with evals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pyyaml>=6.0.3",
    "openai>=3.28.0",
    "fastembed>=0.9.0",
]

[project.scripts]
rag = "rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs the docker compose Postgres (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
